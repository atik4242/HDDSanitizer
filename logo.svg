<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <!-- Accent Red/Orange Gradient (Erase Theme) -->
    <linearGradient id="eraseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <!-- Cyan Glow Gradient (Tech Theme) -->
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Outer Shield -->
  <path d="M256 32 L416 96 V224 C416 336 344 432 256 480 C168 432 96 336 96 224 V96 Z" 
        fill="url(#shieldGrad)" stroke="#334155" stroke-width="12" />

  <!-- Hard Drive Platter (Circle Inner) -->
  <circle cx="256" cy="230" r="110" fill="none" stroke="url(#techGrad)" stroke-width="16" stroke-dasharray="12 8" />
  <circle cx="256" cy="230" r="45" fill="none" stroke="#475569" stroke-width="10" />
  <circle cx="256" cy="230" r="18" fill="#38BDF8" />

  <!-- Sanitize / Erase Cross (Cyber Blade/Laser) -->
  <path d="M160 134 L352 326 M352 134 L160 326" 
        stroke="url(#eraseGrad)" stroke-width="24" stroke-linecap="round" />
</svg>
